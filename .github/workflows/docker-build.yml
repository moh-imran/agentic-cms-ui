name: Build & Push agentic-cms-ui

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push agentic-cms-ui
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/agentic-cms-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            mkdir -p /home/deploy/agentic-cms

            cat > /home/deploy/agentic-cms/docker-compose.yml << 'EOF'
services:
  agentic-cms-ui:
    image: ghcr.io/${{ secrets.GHCR_USER }}/agentic-cms-ui:latest
    container_name: agentic-cms-ui
    restart: unless-stopped
    ports:
      - "5176:80"
    networks:
      - rag-shared-network

networks:
  rag-shared-network:
    external: true
    name: rag-shared-network
EOF

            cd /home/deploy/agentic-cms
            docker compose pull
            docker compose up -d

            docker logout ghcr.io

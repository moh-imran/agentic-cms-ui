name: Deploy agentic-cms-ui

on:
  workflow_run:
    workflows: ["Build & Push agentic-cms-ui"]
    types:
      - completed
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: SSH & Deploy
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin

            mkdir -p /home/deploy/agentic-cms

            cat > /home/deploy/agentic-cms/docker-compose.yml << 'EOF'
            services:
              agentic-cms-ui:
                image: ghcr.io/${{ secrets.GHCR_USER }}/agentic-cms-ui:latest
                container_name: agentic-cms-ui
                restart: unless-stopped
                ports:
                  - "5176:80"
                networks:
                  - rag-shared-network

            networks:
              rag-shared-network:
                external: true
                name: rag-shared-network
            EOF

            cd /home/deploy/agentic-cms
            GHCR_OWNER=${{ secrets.GHCR_USER }} docker compose pull
            GHCR_OWNER=${{ secrets.GHCR_USER }} docker compose up -d

            docker logout ghcr.io
